# AutoDev supervisor and lifecycle primitives - install metadata.
#
# This manifest sits at the install root alongside the
# ``autocoder_supervisor/`` and ``autocoder_lifecycle/`` package
# directories so that ``pip install /opt/aed-supervisor`` (or any
# other install root) finds both packages and the manifest together.
# The documented install procedure is:
#
#     sudo cp -r autocoder_supervisor /opt/aed-supervisor/
#     sudo cp -r autocoder_lifecycle /opt/aed-supervisor/
#     sudo cp pyproject.toml /opt/aed-supervisor/pyproject.toml
#     sudo python3 -m pip install /opt/aed-supervisor
#
# ``[tool.setuptools.packages.find]`` searches ``where = ["."]``
# relative to the manifest (i.e. the install root) for
# subdirectories named ``autocoder_supervisor`` and
# ``autocoder_lifecycle`` and packages both. The lifecycle
# primitives are generic, autonomous-development scaffolding
# (no project-, provider-, or repository-specific coupling) and
# ship as a sibling of the supervisor package.
#
# Distribution name: ``autocoder-supervisor``.
# Import packages: ``autocoder_supervisor`` and
# ``autocoder_lifecycle`` (the lifecycle primitives are a
# separate, project-neutral package).

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autocoder-supervisor"
# All three packages ship together: autocoder_supervisor, autocoder_lifecycle, autocoder_orchestration
version = "1.0.0"
description = "AutoDev supervisor and lifecycle primitives v1"
requires-python = ">=3.10"
# Python <3.11 does not have the tomllib stdlib module.
# The supervisor's config.py falls back to ``tomli`` on those
# versions, so we declare the dependency conditionally.
dependencies = [
    'tomli>=1.1; python_version<"3.11"',
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autocoder_supervisor*", "autocoder_lifecycle*", "autocoder_orchestration*"]
exclude = ["tests*", "provenance*", "docs*", "examples*", "service*"]  # noqa: E501
