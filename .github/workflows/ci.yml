name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-3-10:
    name: test (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: pytest -q tests/test_autocoder_supervisor.py tests/test_autocoder_supervisor_packaging.py tests/test_extraction_provenance.py --no-header
        env:
          AED_PR_NUMBER: "0"
          AED_REPO_OWNER: Slideshow11
          AED_REPO_NAME: AutoDev
          AED_AUTHORITATIVE_HEAD: "0000000000000000000000000000000000000000"

  test-3-11:
    name: test (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q tests/test_autocoder_supervisor.py tests/test_autocoder_supervisor_packaging.py tests/test_extraction_provenance.py --no-header
        env:
          AED_PR_NUMBER: "0"
          AED_REPO_OWNER: Slideshow11
          AED_REPO_NAME: AutoDev
          AED_AUTHORITATIVE_HEAD: "0000000000000000000000000000000000000000"

  test-3-12:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests/test_autocoder_supervisor.py tests/test_autocoder_supervisor_packaging.py tests/test_extraction_provenance.py --no-header
        env:
          AED_PR_NUMBER: "0"
          AED_REPO_OWNER: Slideshow11
          AED_REPO_NAME: AutoDev
          AED_AUTHORITATIVE_HEAD: "0000000000000000000000000000000000000000"

  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python3 -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel filename uses autocoder_supervisor
        run: |
          set -e
          # After setuptools normalisation the wheel filename
          # is derived from the import package name
          # (autocoder_supervisor, not the distribution name).
          wheel=$(ls dist/autocoder_supervisor-*.whl | head -1)
          echo "wheel: $wheel"
          test -n "$wheel"
      - name: Create isolated venv and install with declared deps
        run: |
          python3 -m venv venv
          # The staged install (no PYTHONPATH) is the real
          # production install. We do NOT pass --no-deps here
          # so the conditional tomli dependency is installed
          # on Python <3.11.
          venv/bin/pip install dist/autocoder_supervisor-*.whl
      - name: Verify import resolves from site-packages
        run: |
          cd /tmp
          env -u PYTHONPATH /home/runner/work/AutoDev/AutoDev/venv/bin/python -c "
          import autocoder_supervisor
          from autocoder_supervisor import supervisor, validate, config, contracts
          assert 'site-packages' in autocoder_supervisor.__file__
          print('imported from:', autocoder_supervisor.__file__)
          "
      - name: Verify module help commands exit 0
        run: |
          env -u PYTHONPATH venv/bin/python -m autocoder_supervisor.supervisor --help
          env -u PYTHONPATH venv/bin/python -m autocoder_supervisor.validate --help

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate provenance manifest
        run: python3 tests/test_extraction_provenance.py

  committed-state-scan:
    name: committed-state-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run canonical committed-state scan
        run: python3 scripts/canonical_scanner.py
