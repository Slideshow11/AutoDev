name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-3-10:
    name: test (3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pytest
      - run: pytest -q tests/test_autocoder_supervisor.py tests/test_autocoder_supervisor_packaging.py --no-header
        env:
          AED_PR_NUMBER: "0"
          AED_REPO_OWNER: Slideshow11
          AED_REPO_NAME: AutoDev
          AED_AUTHORITATIVE_HEAD: "0000000000000000000000000000000000000000"

  test-3-11:
    name: test (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest -q tests/test_autocoder_supervisor.py tests/test_autocoder_supervisor_packaging.py --no-header
        env:
          AED_PR_NUMBER: "0"
          AED_REPO_OWNER: Slideshow11
          AED_REPO_NAME: AutoDev
          AED_AUTHORITATIVE_HEAD: "0000000000000000000000000000000000000000"

  test-3-12:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests/test_autocoder_supervisor.py tests/test_autocoder_supervisor_packaging.py --no-header
        env:
          AED_PR_NUMBER: "0"
          AED_REPO_OWNER: Slideshow11
          AED_REPO_NAME: AutoDev
          AED_AUTHORITATIVE_HEAD: "0000000000000000000000000000000000000000"

  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: python3 -m pip wheel --no-deps --wheel-dir dist .
      - name: Create isolated venv and install
        run: |
          python3 -m venv venv
          venv/bin/pip install --no-deps dist/aed_supervisor-*.whl
      - name: Verify import resolves from site-packages
        run: |
          cd /tmp
          env -u PYTHONPATH /home/runner/work/AutoDev/AutoDev/venv/bin/python -c "
          import autocoder_supervisor
          from autocoder_supervisor import supervisor, validate, config, contracts
          assert 'site-packages' in autocoder_supervisor.__file__
          print('imported from:', autocoder_supervisor.__file__)
          "
      - name: Verify module help commands exit 0
        run: |
          env -u PYTHONPATH venv/bin/python -m autocoder_supervisor.supervisor --help
          env -u PYTHONPATH venv/bin/python -m autocoder_supervisor.validate --help

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate provenance manifest
        run: python3 tests/test_extraction_provenance.py

  committed-state-scan:
    name: committed-state-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for secrets and user paths
        run: |
          python3 - <<'PY'
          import os, sys
          # The forbidden-token list is loaded from a separate
          # committed file so the literal tokens do not appear
          # in this workflow definition (which would otherwise
          # fail the same scan).
          with open('.github/workflows/scan-forbidden.txt') as f:
              forbidden = [line.rstrip('\n') for line in f if line.strip()]
          # Files that are allowed to mention forbidden tokens
          # as part of fixture / test-detection / documented
          # validator-rejection-pattern logic.
          ALLOW = {
              'tests/test_autocoder_supervisor.py',
              'tests/test_extraction_provenance.py',
              'autocoder_supervisor/config.py',
              'autocoder_supervisor/supervisor.py',
              'autocoder_supervisor/contracts.py',
              'INVARIANTS.md',
              'autocoder_supervisor/INVARIANTS.md',
          }
          failures = []
          for root, dirs, files in os.walk('.'):
              if '/.git/' in root or '/__pycache__/' in root or '/dist/' in root or '/venv/' in root or '/.pytest_cache/' in root:
                  continue
              for f in files:
                  p = os.path.join(root, f)
                  rel = os.path.relpath(p, '.')
                  if rel in ALLOW:
                      continue
                  try:
                      with open(p, 'rb') as fh:
                          content = fh.read()
                      text = content.decode('utf-8', errors='replace')
                  except Exception:
                      continue
                  for token in forbidden:
                      if token in text:
                          failures.append(f"{p}: contains {token!r}")
          if failures:
              print("FAIL: committed-state-scan detected forbidden tokens:")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("OK: committed-state-scan")
          PY
